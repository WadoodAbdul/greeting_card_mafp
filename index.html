<!DOCTYPE html>
<html>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.6.0/dist/aframe-extras.min.js"></script>
  <body style="margin : 0px; overflow: hidden;">
    <a-scene embedded arjs>
      <a-assets>
        <!-- <a-asset-item id="myModel" src="./path/to/your/model.glb"></a-asset-item> -->
        <audio id="avatarAudio" src="audio/diologues_w_emotions.mp3" preload="auto"></audio>
      </a-assets>
      <a-marker type="pattern" url="data/pattern-link_qr.patt">
        <a-entity
          id = 'avatar'
          position="0 0 0"
          scale="0.5 0.5 0.5"
          gltf-model="models/idle_animated_aida.glb"
          animation-mixer="clip: *; loop: repeat"
          sound="src: #avatarAudio; autoplay: false; loop: false; volume: 0.7"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
  const marker = document.querySelector('a-marker');
  const avatar = document.querySelector('#avatar');
  const audioEl = document.querySelector('#avatarAudio');

  // Get the A-Frame sound system (which wraps AudioContext)
  const sceneEl = document.querySelector('a-scene');

  // ✅ Unlock audio context on first user gesture
  function unlockAudio() {
    const audioCtx = sceneEl.audioListener.context; // A-Frame exposes the AudioContext here
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        console.log("AudioContext resumed");
      });
    }

    // Also unlock the HTML audio element (Safari needs this too)
    audioEl.play().then(() => {
      audioEl.pause();
      console.log("HTMLAudio element unlocked");
    }).catch(e => console.warn("Unlock failed:", e));

    document.body.removeEventListener("touchend", unlockAudio);
    document.body.removeEventListener("click", unlockAudio);
  }

  document.body.addEventListener("touchend", unlockAudio);
  document.body.addEventListener("click", unlockAudio);

  // Marker events
  marker.addEventListener('markerFound', () => {
    console.log('Marker found - starting audio');
    avatar.components.sound.playSound();
  });

  marker.addEventListener('markerLost', () => {
    console.log('Marker lost - pausing audio');
    avatar.components.sound.pauseSound();
  });
    </script>
  </body>
</html>
